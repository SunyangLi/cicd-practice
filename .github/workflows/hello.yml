name: Build Demo

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache mathlib
        id: cache-mathlib
        uses: actions/cache@v4
        with:
          path: vendor
          key: mathlib-v1.0.0-windows   # 版本号变了,这个 key 也要变,才会触发重新下载

      - name: Fetch dependencies
        if: steps.cache-mathlib.outputs.cache-hit != 'true'   # 只有没命中缓存才真的下载
        run: .\scripts\fetch_deps.ps1

      - name: Configure
        run: >
          cmake -B build
          -DMATHLIB_ROOT="${{ github.workspace }}/vendor"
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug

      - name: Run
        run: .\build\Debug\demo.exe

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Package
        run: |
          mkdir dist
          copy build\Debug\demo.exe dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-windows
          path: dist/