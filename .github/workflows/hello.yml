name: Build Demo

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Run
        run: .\build\Debug\demo.exe

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure